# Local stand-in for the cluster: MongoDB, MinIO and the API, wired together
# exactly the way the Kubernetes manifests wire them.
#
#   cp .env.example .env.compose   # fill in GEMINI_API_KEY, then:
#   docker compose up --build
#   docker compose run --rm api npm run seed:reviewer:prod -- \
#     --username reviewer --password 'a-strong-password'
#
# Run the client against it with `npm run dev` in ../deepdoc_client, which
# already points at http://localhost:8000.
#
# Worth doing before touching Kubernetes: most of what breaks in a deployment
# is configuration, the configuration here is the same configuration, and the
# feedback loop is seconds instead of minutes. In particular this is where the
# split between S3_ENDPOINT and S3_PUBLIC_ENDPOINT gets exercised — the API
# reaches MinIO at `minio:9000` on the compose network, while the presigned
# links it hands out have to work from a browser on the host.

name: deepdoc

services:
  mongodb:
    image: mongo:8
    # Without this, WiredTiger sizes its cache from the host's total RAM.
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Must match AWS_REGION below, or every presigned URL fails to verify.
      MINIO_REGION_NAME: us-east-1
    ports:
      # Published so presigned links open from a browser on the host.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  createbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/deepdoc &&
      echo 'bucket ready'
      "

  api:
    build:
      context: .
    depends_on:
      mongodb:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: "8000"
      MONGODB_URI: mongodb://root:rootpassword@mongodb:27017/deepdoc?authSource=admin
      JWT_SECRET: local-development-secret-not-for-production
      CORS_ORIGINS: http://localhost:3000
      # Only real secret here. Put it in .env.compose rather than in this file.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env.compose}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: deepdoc
      # Reached over the compose network by the API itself...
      S3_ENDPOINT: http://minio:9000
      # ...but signed for the address a browser on the host can resolve.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
    env_file:
      - path: .env.compose
        required: false

volumes:
  mongodb-data:
  minio-data:
